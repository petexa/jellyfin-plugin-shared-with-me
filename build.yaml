overview: "Share one title with one other profile, such as a film above a child's age limit."
description: >
  A user who can see a film or series can share it with one other profile that cannot. The title appears for that profile in a library of its own. To keep it there, the plugin changes every profile's library access list and blocked tags: read the README before installing. Sharing works from the web page the plugin adds, and from TV apps through private playlists.
category: "General"
artifacts:
  - "Jellyfin.Plugin.SharedWithMe.dll"
changelog: >
  Parent approval: shares by restricted profiles can wait for an administrator, with an optional webhook notification. Expiring shares (until removed, a day, a week or a date; a default for TV shares). A fourth 'Who may share' choice: administrators and ticked profiles. Fix: a profile that blocks unrated 'Other' items can now list its own 'Share with' playlists in TV apps. Read the README before downgrading: 0.1 cannot read a share that is waiting for approval.
