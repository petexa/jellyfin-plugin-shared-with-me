overview: "Share one title with one other profile, such as a film above a child's age limit."
description: >
  A user who can see a film or series can share it with one other profile that cannot. The title appears for that profile in a library of its own. To keep it there, the plugin changes every profile's library access list and blocked tags: read the README before installing. Sharing works from the web page the plugin adds, and from TV apps through private playlists.
